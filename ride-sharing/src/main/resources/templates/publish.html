<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publish ride · Ride Sharing</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><section class="narrow card"><h1>Publish a ride</h1><p class="muted">Choose your departure time and price per seat. Reservations do not collect payment.</p><form th:action="@{/rides/new}" method="post"><label>From<input name="from" maxlength="100" required></label><label>To<input name="to" maxlength="100" required></label><label>Departure<input name="departure" type="datetime-local" required></label><label>Price per seat (₹)<input name="price" type="number" min="0.01" max="999999.99" step="0.01" required></label><label>Available seats<input name="seats" type="number" min="1" max="6" value="3" required></label><label>Car model<input name="car" maxlength="100" required></label><button>Publish ride</button></form></section></main><footer>Ride Sharing · Better journeys, together.</footer></body></html>
