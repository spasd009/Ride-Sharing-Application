<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Ride Sharing</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><section class="narrow card"><h1>Create your account</h1><form th:action="@{/register}" method="post"><label>Username<input name="username" pattern="[A-Za-z0-9_]{3,40}" minlength="3" maxlength="40" autocomplete="username" required></label><p class="muted">3–40 letters, numbers or underscores. Usernames are case sensitive.</p><label>Password<input name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required></label><button>Create account</button></form></section></main><footer>Ride Sharing · Better journeys, together.</footer></body></html>
