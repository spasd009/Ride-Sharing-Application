<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find rides · Ride Sharing</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><p class="eyebrow">TRAVEL TOGETHER</p><h1>Find your next ride</h1><form class="filters" th:action="@{/rides}" method="get"><label>From<input name="from" th:value="${from}" maxlength="100"></label><label>To<input name="to" th:value="${to}" maxlength="100"></label><label>Date<input type="date" name="date" th:value="${date}"></label><button>Search</button></form><section class="grid"><article class="card" th:each="r : ${rides}"><p class="eyebrow" th:text="${r.CAR}"></p><h2><span th:text="${r.ORIGIN}"></span> → <span th:text="${r.DESTINATION}"></span></h2><p>Departure: <strong th:text="${r.DEPARTURE}"></strong></p><p><strong th:text="'₹' + ${r.PRICE}"></strong> per seat · <span th:text="${r.SEATS}"></span> seats left</p><form th:action="@{/rides/{id}/book(id=${r.ID})}" method="post"><button>Book one seat</button></form></article></section><p th:if="${#lists.isEmpty(rides)}">No matching upcoming rides. <a href="/rides/new">Publish the first one.</a></p></main><footer>Ride Sharing · Better journeys, together.</footer></body></html>
