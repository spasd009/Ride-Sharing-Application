<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account · Ride Sharing</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><h1>Your account</h1><h2>Bookings</h2><section class="grid"><article class="card" th:each="b : ${bookings}"><h3><span th:text="${b.ORIGIN}"></span> → <span th:text="${b.DESTINATION}"></span></h3><p th:text="${b.DEPARTURE}"></p><p th:text="'₹' + ${b.PRICE} + ' · One reserved seat'"></p><form th:action="@{/bookings/{id}/cancel(id=${b.BOOKING_ID})}" method="post"><button class="danger">Cancel booking</button></form></article></section><p th:if="${#lists.isEmpty(bookings)}">You have no bookings yet.</p><h2>Published rides</h2><section class="grid"><article class="card" th:each="r : ${published}"><h3><span th:text="${r.ORIGIN}"></span> → <span th:text="${r.DESTINATION}"></span></h3><p th:text="${r.DEPARTURE}"></p><p th:text="${r.SEATS} + ' seats remaining'"></p></article></section><p th:if="${#lists.isEmpty(published)}">You have not published a ride yet.</p></main><footer>Ride Sharing · Better journeys, together.</footer></body></html>
