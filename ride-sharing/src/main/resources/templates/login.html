<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Ride Sharing</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><section class="narrow card"><h1>Welcome back</h1><p class="notice" th:if="${param.error}">Username or password is incorrect.</p><form th:action="@{/login}" method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form><p>New here? <a href="/register">Create an account</a></p></section></main><footer>Ride Sharing · Better journeys, together.</footer></body></html>
