name: ride-sharing Java build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'ride-sharing/pom.xml'
      - run: mvn -B verify
        working-directory: 'ride-sharing'
